<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🛒 Cart Vault | RA Bros</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#050505;
  color:white;
}

header {
  text-align:center;
  padding:30px;
  border-bottom:1px solid #222;
}

.container {
  max-width:800px;
  margin:auto;
  padding:20px;
}

.item {
  display:flex;
  align-items:center;
  margin-bottom:20px;
  padding:15px;
  background:#111;
  border-radius:12px;
}

.item img {
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:10px;
}

.info {
  flex:1;
  margin-left:15px;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.remove {
  background:#ff0033;
  color:white;
}

.checkout {
  width:100%;
  padding:15px;
  background:#00d4ff;
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<header><h1>CART VAULT</h1></header>

<div class="container">
  <div id="cart"></div>
  <button class="checkout" onclick="checkout()">CHECKOUT</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartDiv = document.getElementById("cart");

function renderCart(){
  cartDiv.innerHTML = "";

  cart = cart.filter(i => i && i.name && i.image);

  if(cart.length === 0){
    cartDiv.innerHTML = "<p>Cart empty 🕳️</p>";
    return;
  }

  cart.forEach((item,index)=>{
    cartDiv.innerHTML += `
      <div class="item">
        <img src="${item.image}">
        <div class="info">${item.name}</div>
        <button class="remove" onclick="removeItem(${index})">Remove</button>
      </div>
    `;
  });
}

function removeItem(i){
  cart.splice(i,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

renderCart();
</script>

<script type="module">
import { db, login } from "./firebase.js";
import { addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

window.checkout = async function(){

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  if(cart.length === 0){
    alert("Cart empty ❌");
    return;
  }

  try {
    const user = await login();

    await addDoc(collection(db, "orders"), {
      email: user.email,
      items: cart,
      status: "pending",
      time: serverTimestamp()
    });

    alert("Order placed 🚀");

    localStorage.removeItem("cart");
    location.reload();

  } catch(e){
    console.error(e);
    alert("Checkout failed ❌");
  }
};
</script>

</body>
</html>
