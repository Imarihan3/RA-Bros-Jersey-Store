<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Vault | RA Bros Accessories</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --gold:#d4af37;
  --neon-red:#ff0033;
  --dark-matte:#050505;
}

body {
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--dark-matte);
  color:white;
  overflow-x:hidden;
}

/* Glow */
#glow {
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(255,0,51,0.15), transparent 50%);
  pointer-events:none;
}

/* Header */
header {
  padding:80px 20px 40px;
  text-align:center;
}

.logo-tag {
  font-size:0.7rem;
  letter-spacing:5px;
  color:var(--neon-red);
}

h1 {
  font-size:3rem;
  font-weight:900;
}

/* Grid */
.vault-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:40px;
  padding:40px;
  max-width:1400px;
  margin:auto;
}

/* Card */
.item-card {
  background:#0a0a0a;
  padding:20px;
  transition:0.4s;
}

.item-card:hover {
  transform:translateY(-10px);
}

/* Image */
.image-wrapper {
  height:250px;
  overflow:hidden;
}

.image-wrapper img {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Button */
.btn-buy {
  width:100%;
  border:1px solid var(--neon-red);
  background:transparent;
  color:white;
  padding:15px;
  cursor:pointer;
}

/* Back + Cart */
.back-btn {
  position:fixed;
  top:30px;
  left:30px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid var(--neon-red);
}

.cart-btn {
  position:fixed;
  top:30px;
  right:30px;
  color:white;
  text-decoration:none;
  border-bottom:1px solid var(--neon-red);
}
</style>
</head>

<body>

<div id="glow"></div>

<a href="#" class="back-btn" onclick="history.back()">EXIT</a>
<a href="cart.html" class="cart-btn" id="cartBtn">🛒 CART (0)</a>

<header>
  <span class="logo-tag">RA BROS ARCHIVE</span>
  <h1>The Accessories Vault</h1>
</header>

<div class="vault-grid">

<!-- ITEM TEMPLATE (x10) -->

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/10/FIFA_World_Cup_Trophy_%28Ank_Kumar%2C_Infosys_Limited%29_04.jpg">
  </div>
  <h3>FIFA World Cup Trophy</h3>
  <button class="btn-buy" onclick="buy('FIFA World Cup Trophy', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_o4msiXzg9DpQoMatiFzNA6dhObNc1YFIMg&s">
  </div>
  <h3>1966 Medal</h3>
  <button class="btn-buy" onclick="buy('1966 Medal', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://imagenes.elpais.com/resizer/v2/EITSEQUP3BHTJAUVUYMMBO65UQ.jpg">
  </div>
  <h3>Messi Contract</h3>
  <button class="btn-buy" onclick="buy('Messi Contract', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQILUKkkYVC0YFdvFeV8Uw1aCXlnlfSnt2NtQ&s">
  </div>
  <h3>Zidane Headband</h3>
  <button class="btn-buy" onclick="buy('Zidane Headband', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRM8XmCrLjkhPCmCZUmdtUlRNUU1-3mlv5TYw&s">
  </div>
  <h3>Rare Jersey</h3>
  <button class="btn-buy" onclick="buy('Rare Jersey', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://i.ytimg.com/vi/ylsjSAsujqU/hq720.jpg">
  </div>
  <h3>Ronaldo Contract</h3>
  <button class="btn-buy" onclick="buy('Ronaldo Contract', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoySyk38DyNhS9kWohBbyWJfhlcFOmG3iT_w&s">
  </div>
  <h3>Captain Armband</h3>
  <button class="btn-buy" onclick="buy('Captain Armband', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTYmeuApkfPpWDbnJnsgc1y-flgaEU0vdvzyQ&s">
  </div>
  <h3>Order of Merit</h3>
  <button class="btn-buy" onclick="buy('Order of Merit', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://holygrails.in/cdn/shop/files/CustomAirForce1xFCBarcelonaSportsThemeSneaker-PublicSides.jpg">
  </div>
  <h3>Leather Sneakers</h3>
  <button class="btn-buy" onclick="buy('Sneakers', this)">Acquire</button>
</div>

<div class="item-card">
  <div class="image-wrapper">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBgnb_6PJMWd3Dio75s7DH5BIgT8w4g3Yf7Q&s">
  </div>
  <h3>Club Scarf</h3>
  <button class="btn-buy" onclick="buy('Club Scarf', this)">Acquire</button>
</div>

</div>

<script>
// glow
document.addEventListener('mousemove', e=>{
  document.documentElement.style.setProperty('--x',(e.clientX/window.innerWidth)*100+'%');
  document.documentElement.style.setProperty('--y',(e.clientY/window.innerHeight)*100+'%');
});

// update cart count
function updateCart(){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cartBtn").innerText = "🛒 CART ("+cart.length+")";
}
updateCart();

// ADD TO CART
function buy(name, btn){
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  const img = btn.parentElement.querySelector("img").src;

  cart.push({
    name:name,
    image:img,
    qty:1,
    price:999
  });

  localStorage.setItem("cart", JSON.stringify(cart));

  updateCart();

  alert(name + " added 🛒");
}
</script>

</body>
</html>
